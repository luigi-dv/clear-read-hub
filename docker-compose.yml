# Local stack: API + worker + MongoDB + Redis + Azurite (local Azure Storage).
#
#   docker compose up --build        # http://localhost:8000/docs
#
# Works without any configuration. To change a setting, copy .env.example to .env:
# values in .env override the development defaults below.
#
#   docker compose run --rm tests    # full test suite against these services
#   docker compose run --rm demo     # upload a sample document end to end

x-app: &app
  build:
    context: .
    target: runtime
  image: clear-read-hub:local
  env_file:
    - path: .env
      required: false
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-development}
    # Public development secret: the app refuses it when ENVIRONMENT=production
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-insecure-local-development-secret-do-not-use-in-production}
    MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-clearreadhub}:${MONGO_ROOT_PASSWORD:-clearreadhub}@mongodb:27017/?authSource=admin
    REDIS_URL: redis://redis:6379/0
    QUEUE_BACKEND: rq
    STORAGE_BACKEND: azure
    AZ_STORAGE_CONNECTION_STRING: &azurite DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  depends_on:
    mongodb:
      condition: service_healthy
    redis:
      condition: service_healthy
    azurite:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["api"]
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["worker"]
    healthcheck:
      disable: true

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-clearreadhub}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-clearreadhub}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck"]
    volumes:
      - azurite_data:/data
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Runs the whole test suite, integration tests included, against the services above
  tests:
    build:
      context: .
      target: test
    image: clear-read-hub:test
    profiles: [tools]
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-clearreadhub}:${MONGO_ROOT_PASSWORD:-clearreadhub}@mongodb:27017/?authSource=admin
      REDIS_URL: redis://redis:6379/0
      AZ_STORAGE_CONNECTION_STRING: *azurite
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy

  # Registers a demo user, uploads a sample document and prints the extracted text
  demo:
    image: clear-read-hub:test
    build:
      context: .
      target: test
    profiles: [tools]
    command: ["python", "scripts/demo.py"]
    environment:
      API_URL: http://api:8000
      PUBLIC_URL: http://localhost:${API_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
  azurite_data:
